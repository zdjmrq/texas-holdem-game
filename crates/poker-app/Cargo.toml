[package]
name = "poker-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "poker-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# 内嵌 01.mp3 作为无 assets 目录时的兜底；发布版默认从外置 assets/music 加载。
embedded-music = []
# 接入真实 poker-ai 的开关（当前是 no-op 骨架；Phase 4 完成后在此加 optional 依赖，
# 见 src/ai_bridge.rs）。默认关闭，默认构建不受影响。
real-ai = []

[dependencies]
poker-core = { workspace = true }
poker-engine = { workspace = true }
poker-prob = { workspace = true }
# Online integration (Lead decision A): embedded poker-server + poker-client,
# exposing the OnlineController mount point. poker-ai is still not a dependency;
# the temporary DeterministicAi is behind the AiPolicy trait (see ai_bridge.rs).
poker-protocol = { workspace = true }
poker-client = { workspace = true }
poker-server = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# GUI: egui/eframe 0.37.x（默认 wgpu 渲染 + 系统字体回退 + wayland/x11）
eframe = { version = "0.37" }
# 音频：rodio 0.23（playback + mp3/symphonia）
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# PNG 编解码：窗口图标与截图
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# For the online UI integration tests (ui-analyst in src/online/**): mock WS server.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }

# Windows-only shell integration: tray icon + single-instance lock.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
single-instance = "0.3"
