name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [rust-rewrite]

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
      - name: Build and stage native release
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify executable and package release download
        shell: pwsh
        run: |
          $dist = "dist/texas-holdem-rs-current"
          $exe = "$dist/texas-holdem-rs.exe"
          $process = Start-Process -FilePath $exe -ArgumentList '--help' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { throw 'Executable --help did not terminate' }
          if ($process.ExitCode -ne 0) { throw "Executable failed to start: $($process.ExitCode)" }
          if (-not (Test-Path "$dist/assets/fonts/NotoSansSC-Regular.otf")) { throw 'Missing font' }
          if ((Get-ChildItem "$dist/assets/music/*.mp3").Count -ne 4) { throw 'Missing music' }
          $version = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$dist/cli-version.txt"
          if (-not $version.WaitForExit(30000) -or $version.ExitCode -ne 0) { throw 'Executable --version failed' }
          if ((Get-Content "$dist/cli-version.txt" -Raw).Trim() -notmatch '2\.0\.0$') { throw 'Incorrect product version' }
          @("Version: 2.0.0", "Commit: ${{ github.sha }}") | Set-Content "$dist/VERSION.txt" -Encoding ascii
          Compress-Archive -Path $dist -DestinationPath "dist/texas-holdem-rs-windows-x64.zip" -Force
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash "dist/texas-holdem-rs-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$zipHash  texas-holdem-rs-windows-x64.zip", "$exeHash  texas-holdem-rs-current/texas-holdem-rs.exe") | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: texas-holdem-rs-windows-x64
          path: |
            dist/texas-holdem-rs-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 30
