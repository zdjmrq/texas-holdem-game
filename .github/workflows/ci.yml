name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REFERENCE_REPO: ${{ github.workspace }}/reference/texas-holdem-game

jobs:
  fmt-clippy-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform for the product; Linux is the
        # development/automation platform for the Rust rewrite.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --keep-going --workspace --all-targets -- -D warnings
      # The two interop tests spawn the original JS project and need Node + the
      # reference checkout; they run in the golden-oracle job below.
      - run: cargo test --workspace --exclude poker-server
      - run: cargo test -p poker-server --lib --test integration --test phase_b --test rust_interop

  golden-oracle:
    # Re-generates every golden corpus from the pinned reference JS project and
    # fails when the committed corpus differs (determinism + provenance check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check out reference JS project at the pinned commit
        run: |
          mkdir -p reference
          git clone https://github.com/zdjmrq/texas-holdem-game.git reference/texas-holdem-game
          cd reference/texas-holdem-game
          git checkout e0c6c6f88d3e64324e1d83bfc700dd3a77f71b90
          npm ci --omit=dev
      - name: Regenerate golden corpora
        run: |
          node oracle/golden-eval.js
          node oracle/golden-engine.js
          node oracle/golden-equity.js
          node oracle/golden-ai.js
          node oracle/golden-protocol.js
      - name: Fail on any corpus drift
        run: git diff --exit-code -- tests/golden
      - name: Bidirectional interop (JS client <-> Rust server, Rust client <-> JS server)
        run: cargo test -p poker-server --test interop -- --test-threads=1
